[package]
name = "rimage-gui"
version = "3.0.0"
edition = "2024"
description = "Windows GUI for rimage"
license = "MIT"
build = "build.rs"

[lib]
name = "rimage_gui"
path = "src/lib.rs"

[[bin]]
name = "rimage-gui"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.15"
directories = "6.0.0"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.8", default-features = false, features = ["avif", "bmp", "ff", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tiff", "webp"] }
rfd = "0.15.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
sys-locale = "0.3.2"
tempfile = "3.21.0"
thiserror = "2.0.16"
walkdir = "2.5.0"

[build-dependencies]
winresource = "0.1.22"

[dev-dependencies]
tempfile = "3.21.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
